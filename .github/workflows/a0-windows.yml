name: A0-A7 Windows integration and final acceptance harness preflight
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: a0-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64]
    # Process-scoped policy; no persistent changes to the Windows runner.
    env:
      PSExecutionPolicyPreference: Bypass
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv (no machine-wide Python install)
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: Install workspace-local Python and SCons
        shell: powershell
        run: |
          uv python install 3.12
          if ($LASTEXITCODE -ne 0) { throw 'uv python install failed' }
          uv venv .venv --python 3.12
          if ($LASTEXITCODE -ne 0) { throw 'uv venv failed' }
          uv pip install --python .venv/Scripts/python.exe scons==4.10.0
          if ($LASTEXITCODE -ne 0) { throw 'uv pip install scons failed' }
          $scripts = (Resolve-Path .venv/Scripts).Path
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $scripts
          & .venv/Scripts/python.exe --version
          & .venv/Scripts/scons.exe --version
      - name: Configure persistent SCons cache
        shell: powershell
        run: |
          if (-not $env:RUNNER_TOOL_CACHE) { throw 'RUNNER_TOOL_CACHE is not set' }
          $cache = Join-Path $env:RUNNER_TOOL_CACHE 'sandbox-voxel-a0-scons-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "SCONS_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SCONS_CACHE=$cache"
      - name: Static A0 contract validation
        shell: powershell
        run: python tests/check_a0_contract.py
      - name: Static A1 contract validation
        shell: powershell
        run: python tests/check_a1_contract.py
      - name: Static A2 route and telemetry contract
        shell: powershell
        env:
          A2_REUSE_SNAPSHOT: "0"
        run: python tests/check_a2_contract.py
      - name: Static A3 native edit and SQLite contract
        shell: powershell
        run: python tests/check_a3_contract.py
      - name: A4 static and native A3 ABI parity
        shell: powershell
        run: python tests/check_a4_contract.py
      - name: A5 water, swimmer and shoreline static contract
        shell: powershell
        run: python tests/check_a5_contract.py
      - name: A7 strict acceptance source contract and matrix fail-closed test
        shell: powershell
        run: python tests/check_a7_contract.py
      - name: Restore compiled native binary from approved A3 CI
        uses: actions/download-artifact@v4
        with:
          name: a0-build-snapshot
          run-id: 44522153759
          github-token: ${{ github.token }}
          path: .
      - name: Verify locked Godot and A3 native DLL without C++ rebuild
        shell: powershell
        run: ./scripts/bootstrap-windows.ps1 -RuntimeOnly
      - name: Headless module and GDExtension smoke
        shell: powershell
        run: ./scripts/smoke-windows.ps1
      - name: A1 deterministic SDF and scene smoke
        shell: powershell
        run: ./scripts/a1-smoke-windows.ps1
      - name: A2 deterministic route and headless trace smoke
        shell: powershell
        run: ./scripts/a2-smoke-windows.ps1
      - name: A3 native edit and SQLite reopen smoke
        shell: powershell
        run: ./scripts/a3-smoke-windows.ps1
      - name: A4 batched instancing, physics fixture and persistence reopen
        shell: powershell
        run: ./scripts/a4-smoke-windows.ps1
      - name: A5 buoyancy, current and shoreline SQLite reopen smoke
        shell: powershell
        run: ./scripts/a5-smoke-windows.ps1
      - name: A7 short headless route/edit integrity smoke (not visual or perf qualification)
        shell: powershell
        run: ./scripts/a7-smoke-windows.ps1
      - name: Publish bootstrap build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a0-build-snapshot
          if-no-files-found: ignore
          path: |
            godot/bin/*.dll
            extension_api.json
            reports/generated/a2-ci/*.json
            reports/generated/a2-ci/*.jsonl
            reports/generated/a3-ci/*.json
            reports/generated/a4-ci/*.json
            reports/generated/a5-ci/*.json
            reports/generated/a7-ci/**/*.json
            reports/generated/a7-ci/**/*.jsonl
            reports/generated/a7-ci/**/A7_REPORT.md
